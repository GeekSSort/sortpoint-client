name: Client CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Continuous Integration: Linting, Type Checking & Production Build
  # =========================================================================
  ci-quality-and-build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8000/api/v1' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Next.js Application
        run: npm run build

      - name: Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-output
          path: |
            .next/
            public/
            package.json
            package-lock.json
          retention-days: 7

  # =========================================================================
  # 2. Continuous Delivery / Deployment Stage
  # =========================================================================
  cd-deploy:
    name: Deploy Client Application
    runs-on: ubuntu-latest
    needs: ci-quality-and-build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://sortpoint.example.com

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build-output
          path: dist

      - name: Deployment Trigger
        run: |
          echo "Client CI/CD pipeline succeeded and build bundle is verified for production deployment."

