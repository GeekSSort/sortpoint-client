name: Client CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Continuous Integration: Linting, Type Checking & Production Build
  # =========================================================================
  ci-quality-and-build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8000/api/v1' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Next.js Application
        run: npm run build

      - name: Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-output
          path: |
            .next/
            public/
            package.json
            package-lock.json
          retention-days: 7

  # =========================================================================
  # 2. Continuous Delivery / Deployment Stage (SSH to Contabo)
  # =========================================================================
  cd-deploy:
    name: Deploy Client to Contabo Server
    runs-on: ubuntu-latest
    needs: ci-quality-and-build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH to Contabo
        uses: appleboy/ssh-action@v1.2.2
        if: env.SERVER_HOST != ''
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "Deploying Client on Contabo..."
            cd ${{ secrets.CLIENT_APP_DIR || '/var/www/sortpoint_client' }}
            git pull origin main
            npm ci
            npm run build
            pm2 restart sortpoint-client || pm2 start npm --name "sortpoint-client" -- start
            echo "Client Deployment Completed Successfully!"

